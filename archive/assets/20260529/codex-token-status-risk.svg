<svg xmlns="http://www.w3.org/2000/svg" width="733" height="478" viewBox="0 0 733 478" role="img" aria-labelledby="title desc">
  <title id="title">Codex token status terminal</title>
  <desc id="desc">A terminal-style Codex status screen showing account, permissions, model, and limits.</desc>
  <rect width="733" height="478" fill="#2c001e"/>
  <rect y="0" width="733" height="43" fill="#2f2f2f"/>
  <rect x="6" y="8" width="30" height="28" rx="3" fill="#454545"/>
  <rect x="523" y="5" width="36" height="32" rx="4" fill="#454545"/>
  <rect x="565" y="5" width="35" height="32" rx="4" fill="#454545"/>
  <circle cx="712" cy="21" r="10" fill="#e95420"/>
  <text x="366" y="27" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">whereable-laptop1</text>
  <text x="620" y="28" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18">-</text>
  <rect x="654" y="16" width="12" height="10" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="688" y="28" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18">x</text>

  <text x="0" y="80" fill="#a675cc" font-family="'Ubuntu Mono', Consolas, monospace" font-size="18">/status</text>
  <rect x="4" y="110" width="640" height="269" fill="none" stroke="#d6bfd6" stroke-width="1"/>

  <text x="27" y="134" fill="#d6bfd6" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">&gt;_</text>
  <text x="56" y="134" fill="#ffffff" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17" font-weight="700">OpenAI Codex</text>
  <text x="174" y="134" fill="#d6bfd6" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">(v0.122.0)</text>

  <text x="18" y="169" fill="#00c7d9" font-family="'Ubuntu Mono', Consolas, monospace" font-size="16">Visit https://chatgpt.com/codex/settings/usage for up-to-date</text>
  <text x="18" y="188" fill="#00c7d9" font-family="'Ubuntu Mono', Consolas, monospace" font-size="16">information on rate limits and credits</text>

  <text x="27" y="224" fill="#d6bfd6" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">Model:</text>
  <text x="225" y="224" fill="#ffffff" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">gpt-5.4</text>
  <text x="308" y="224" fill="#d6bfd6" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">(reasoning high, summaries auto)</text>

  <text x="27" y="242" fill="#d6bfd6" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">Directory:</text>
  <text x="225" y="242" fill="#ffffff" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">~</text>

  <text x="27" y="260" fill="#d6bfd6" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">Permissions:</text>
  <text x="225" y="260" fill="#ffffff" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">Custom (workspace-write, on-request)</text>

  <text x="27" y="278" fill="#d6bfd6" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">Agents.md:</text>
  <text x="225" y="278" fill="#ffffff" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">&lt;none&gt;</text>

  <text x="27" y="296" fill="#d6bfd6" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">Account:</text>
  <rect x="220" y="280" width="190" height="23" rx="4" fill="#fbbc04" fill-opacity="0.18" stroke="#fbbc04" stroke-width="2.2"/>
  <text x="225" y="296" fill="#ffffff" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">jmbae@whereable.ai (Business)</text>

  <text x="27" y="314" fill="#d6bfd6" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">Collaboration mode:</text>
  <text x="225" y="314" fill="#ffffff" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">Default</text>

  <text x="27" y="332" fill="#d6bfd6" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">Session:</text>
  <text x="225" y="332" fill="#ffffff" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">019e73ef-8842-70c3-852b-b92c27e6fbcd</text>

  <text x="27" y="367" fill="#d6bfd6" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">Limits:</text>
  <text x="225" y="367" fill="#d6bfd6" font-family="'Ubuntu Mono', Consolas, monospace" font-size="17">refresh requested; run /status again shortly.</text>

  <rect x="0" y="406" width="720" height="53" fill="#5a3650"/>
  <text x="0" y="440" fill="#ffffff" font-family="'Ubuntu Mono', Consolas, monospace" font-size="18">›</text>
  <rect x="18" y="423" width="7" height="19" fill="#e7dce7" opacity="0.85"/>
  <text x="27" y="439" fill="#d6bfd6" font-family="'Ubuntu Mono', Consolas, monospace" font-size="18">Implement {feature}</text>
  <text x="18" y="475" fill="#d6bfd6" font-family="'Ubuntu Mono', Consolas, monospace" font-size="18">gpt-5.4 high · ~</text>
  <rect x="722" y="184" width="6" height="293" rx="3" fill="#d8c7d8"/>
</svg>
