<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AX Seminar Archive</title>
    <style>
      :root {
        --bg: #101114;
        --panel: #181a1f;
        --panel-strong: #202329;
        --text: #f3f1ea;
        --muted: #a9aaad;
        --line: #30333b;
        --accent: #55c2a9;
        --accent-strong: #7ed7c3;
        --mark: #e4b44f;
        --shadow: rgba(0, 0, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
      }

      .shell.sidebar-open {
        grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
      }

      aside {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        border-right: 1px solid var(--line);
        background: var(--panel);
      }

      .sidebar-rail {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 14px 8px;
        border-right: 1px solid var(--line);
      }

      .sidebar-panel {
        min-width: 0;
        display: none;
        flex-direction: column;
      }

      .shell.sidebar-open .sidebar-panel {
        display: flex;
      }

      .brand {
        padding: 24px 22px 18px;
        border-bottom: 1px solid var(--line);
      }

      .brand h1 {
        margin: 0 0 8px;
        font-size: 1.18rem;
        font-weight: 760;
      }

      .brand p {
        margin: 0;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.45;
      }

      .tools {
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }

      .search {
        width: 100%;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 0 12px;
        background: #111318;
        color: var(--text);
        font: inherit;
        outline: none;
      }

      .search:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(85, 194, 169, 0.18);
      }

      .archive-list {
        flex: 1;
        overflow: auto;
        padding: 10px;
      }

      .archive-item {
        width: 100%;
        min-height: 84px;
        display: grid;
        gap: 8px;
        border: 1px solid transparent;
        border-radius: 8px;
        margin: 0 0 8px;
        padding: 12px;
        background: transparent;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }

      .archive-item:hover {
        background: var(--panel-strong);
      }

      .archive-item[aria-current="true"] {
        border-color: rgba(85, 194, 169, 0.58);
        background: rgba(85, 194, 169, 0.1);
      }

      .item-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .item-date {
        color: var(--accent-strong);
        font-size: 0.78rem;
        font-weight: 740;
      }

      .item-status {
        color: var(--mark);
        font-size: 0.72rem;
        font-weight: 740;
      }

      .item-title {
        margin: 0;
        font-size: 0.98rem;
        line-height: 1.35;
        font-weight: 700;
      }

      .item-meta {
        margin: 0;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.4;
      }

      .empty {
        display: none;
        padding: 16px 12px;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .empty.is-visible {
        display: block;
      }

      main {
        min-width: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        background:
          linear-gradient(135deg, rgba(85, 194, 169, 0.1), transparent 32%),
          linear-gradient(315deg, rgba(228, 180, 79, 0.08), transparent 34%),
          #0d0f12;
      }

      .viewer-bar {
        min-height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
        background: rgba(16, 17, 20, 0.88);
        backdrop-filter: blur(14px);
      }

      .viewer-title {
        min-width: 0;
      }

      .viewer-title strong {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.98rem;
      }

      .viewer-title span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 0.78rem;
      }

      .viewer-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .icon-button {
        width: 40px;
        height: 40px;
        display: inline-grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        text-decoration: none;
        cursor: pointer;
      }

      .icon-button:hover {
        border-color: var(--accent);
        color: var(--accent-strong);
      }

      .frame-wrap {
        min-height: 0;
        padding: 14px;
      }

      iframe {
        width: 100%;
        height: 100%;
        min-height: calc(100vh - 96px);
        display: block;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 16px 44px var(--shadow);
      }

      iframe:fullscreen {
        width: 100vw;
        height: 100vh;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      iframe:-webkit-full-screen {
        width: 100vw;
        height: 100vh;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      @media (max-width: 820px) {
        .shell {
          grid-template-columns: 56px minmax(0, 1fr);
        }

        .shell.sidebar-open {
          grid-template-columns: 1fr;
        }

        aside {
          min-height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }

        .shell:not(.sidebar-open) aside {
          border-bottom: 0;
        }

        .shell.sidebar-open aside {
          grid-template-columns: 56px minmax(0, 1fr);
        }

        .shell:not(.sidebar-open) main {
          grid-column: 2;
          grid-row: 1;
        }

        .shell.sidebar-open main {
          grid-column: 1;
        }

        .archive-list {
          display: grid;
          grid-auto-flow: column;
          grid-auto-columns: minmax(240px, 80vw);
          overflow-x: auto;
          padding: 10px 14px;
        }

        .archive-item {
          margin: 0;
        }

        main {
          min-height: 72vh;
        }

        .viewer-bar {
          align-items: flex-start;
        }

        iframe {
          min-height: 72vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell" id="shell">
      <aside>
        <div class="sidebar-rail">
          <button id="toggle-sidebar" class="icon-button" type="button" title="Open archive" aria-label="Open archive" aria-expanded="false">
            &#9776;
          </button>
        </div>
        <div class="sidebar-panel">
          <header class="brand">
            <h1>AX Seminar Archive</h1>
            <p id="archive-count">0 presentations</p>
          </header>
          <div class="tools">
            <input id="search" class="search" type="search" placeholder="Search archive" autocomplete="off">
          </div>
          <nav id="archive-list" class="archive-list" aria-label="Seminar archive"></nav>
          <p id="empty" class="empty">No matching seminars.</p>
        </div>
      </aside>

      <main>
        <header class="viewer-bar">
          <div class="viewer-title">
            <strong id="viewer-title">Loading archive</strong>
            <span id="viewer-meta">GitHub Pages</span>
          </div>
          <div class="viewer-actions">
            <button id="reload-frame" class="icon-button" type="button" title="Reload presentation" aria-label="Reload presentation">
              &#8635;
            </button>
            <button id="fullscreen-frame" class="icon-button" type="button" title="Maximize presentation" aria-label="Maximize presentation">
              &#9974;
            </button>
            <a id="open-current" class="icon-button" href="archive/20260515.html" target="_blank" rel="noreferrer" title="Open presentation" aria-label="Open presentation">
              &#8599;
            </a>
          </div>
        </header>
        <div class="frame-wrap">
          <iframe id="viewer" title="Selected seminar presentation" src="archive/20260515.html" allowfullscreen></iframe>
        </div>
      </main>
    </div>

    <script>
      const fallbackArchive = [
        {
          id: "20260515",
          title: "AX Seminar Presentation",
          date: "2026-05-15",
          path: "archive/20260515.html",
          summary: "Most recent published seminar deck.",
          current: true
        }
      ];

      const state = {
        archives: [],
        selected: null,
        query: ""
      };

      const listEl = document.querySelector("#archive-list");
      const emptyEl = document.querySelector("#empty");
      const searchEl = document.querySelector("#search");
      const countEl = document.querySelector("#archive-count");
      const shellEl = document.querySelector("#shell");
      const toggleEl = document.querySelector("#toggle-sidebar");
      const viewerEl = document.querySelector("#viewer");
      const titleEl = document.querySelector("#viewer-title");
      const metaEl = document.querySelector("#viewer-meta");
      const openEl = document.querySelector("#open-current");
      const reloadEl = document.querySelector("#reload-frame");
      const fullscreenEl = document.querySelector("#fullscreen-frame");

      function formatDate(value) {
        const date = new Date(`${value}T00:00:00`);
        if (Number.isNaN(date.getTime())) return value;
        return new Intl.DateTimeFormat("ko-KR", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(date);
      }

      function normalizeArchive(items) {
        return [...items].sort((a, b) => String(b.date).localeCompare(String(a.date)));
      }

      function getInitialId(archives) {
        const hashId = decodeURIComponent(window.location.hash.replace(/^#/, ""));
        if (hashId && archives.some((item) => item.id === hashId)) return hashId;
        return archives.find((item) => item.current)?.id || archives[0]?.id;
      }

      function renderList() {
        const query = state.query.trim().toLowerCase();
        const filtered = state.archives.filter((item) => {
          const haystack = `${item.id} ${item.date} ${item.title} ${item.summary || ""}`.toLowerCase();
          return haystack.includes(query);
        });

        listEl.replaceChildren();
        emptyEl.classList.toggle("is-visible", filtered.length === 0);

        filtered.forEach((item) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "archive-item";
          button.setAttribute("aria-current", item.id === state.selected?.id ? "true" : "false");
          button.dataset.id = item.id;

          const top = document.createElement("span");
          top.className = "item-top";

          const date = document.createElement("span");
          date.className = "item-date";
          date.textContent = formatDate(item.date);
          top.append(date);

          if (item.current) {
            const status = document.createElement("span");
            status.className = "item-status";
            status.textContent = "CURRENT";
            top.append(status);
          }

          const title = document.createElement("span");
          title.className = "item-title";
          title.textContent = item.title;

          const meta = document.createElement("span");
          meta.className = "item-meta";
          meta.textContent = item.summary || item.path;

          button.append(top, title, meta);
          button.addEventListener("click", () => selectArchive(item.id, true));
          listEl.append(button);
        });
      }

      function selectArchive(id, updateHash = false) {
        const item = state.archives.find((archive) => archive.id === id) || state.archives[0];
        if (!item) return;

        state.selected = item;
        viewerEl.src = item.path;
        viewerEl.title = item.title;
        titleEl.textContent = item.title;
        metaEl.textContent = `${formatDate(item.date)} / ${item.path}`;
        openEl.href = item.path;

        if (updateHash) {
          history.replaceState(null, "", `#${encodeURIComponent(item.id)}`);
          if (window.matchMedia("(max-width: 820px)").matches) {
            setSidebarOpen(false);
          }
        }

        renderList();
      }

      function setSidebarOpen(isOpen) {
        shellEl.classList.toggle("sidebar-open", isOpen);
        toggleEl.setAttribute("aria-expanded", String(isOpen));
        toggleEl.setAttribute("aria-label", isOpen ? "Close archive" : "Open archive");
        toggleEl.setAttribute("title", isOpen ? "Close archive" : "Open archive");
        toggleEl.innerHTML = isOpen ? "&#215;" : "&#9776;";
      }

      function fullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement;
      }

      function requestViewerFullscreen() {
        if (viewerEl.requestFullscreen) return viewerEl.requestFullscreen();
        if (viewerEl.webkitRequestFullscreen) return viewerEl.webkitRequestFullscreen();
        return Promise.reject(new Error("Fullscreen API unavailable"));
      }

      function exitViewerFullscreen() {
        if (document.exitFullscreen) return document.exitFullscreen();
        if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
        return Promise.resolve();
      }

      function updateFullscreenButton() {
        const isFullscreen = fullscreenElement() === viewerEl;
        fullscreenEl.setAttribute("aria-label", isFullscreen ? "Exit presentation fullscreen" : "Maximize presentation");
        fullscreenEl.setAttribute("title", isFullscreen ? "Exit presentation fullscreen" : "Maximize presentation");
        fullscreenEl.innerHTML = isFullscreen ? "&#10005;" : "&#9974;";
      }

      async function togglePresentationFullscreen() {
        try {
          if (fullscreenElement()) {
            await exitViewerFullscreen();
          } else {
            await requestViewerFullscreen();
          }
        } catch (error) {
          if (state.selected) {
            window.open(state.selected.path, "_blank", "noopener,noreferrer");
          }
        } finally {
          updateFullscreenButton();
        }
      }

      async function loadArchive() {
        let items = fallbackArchive;

        try {
          const response = await fetch("archive/manifest.json", { cache: "no-store" });
          if (response.ok) {
            const manifest = await response.json();
            if (Array.isArray(manifest.presentations) && manifest.presentations.length > 0) {
              items = manifest.presentations;
            }
          }
        } catch (error) {
          items = fallbackArchive;
        }

        state.archives = normalizeArchive(items);
        countEl.textContent = `${state.archives.length} presentation${state.archives.length === 1 ? "" : "s"}`;
        selectArchive(getInitialId(state.archives));
      }

      searchEl.addEventListener("input", (event) => {
        state.query = event.target.value;
        renderList();
      });

      toggleEl.addEventListener("click", () => {
        setSidebarOpen(!shellEl.classList.contains("sidebar-open"));
      });

      reloadEl.addEventListener("click", () => {
        if (state.selected) viewerEl.src = state.selected.path;
      });

      fullscreenEl.addEventListener("click", togglePresentationFullscreen);

      document.addEventListener("fullscreenchange", updateFullscreenButton);
      document.addEventListener("webkitfullscreenchange", updateFullscreenButton);

      window.addEventListener("hashchange", () => {
        const id = decodeURIComponent(window.location.hash.replace(/^#/, ""));
        if (id) selectArchive(id);
      });

      loadArchive();
    </script>
  </body>
</html>
