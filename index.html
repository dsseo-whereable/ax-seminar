<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AX Seminar</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f2;
        color: #222222;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100% - 48px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.25rem, 8vw, 5rem);
        line-height: 1;
      }

      p {
        margin: 0;
        color: #555555;
        font-size: 1.125rem;
        line-height: 1.6;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #171717;
          color: #f1f1ee;
        }

        p {
          color: #c4c4bd;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AX Seminar</h1>
      <p>GitHub Pages 임시 게시 페이지입니다.</p>
    </main>
  </body>
</html>
